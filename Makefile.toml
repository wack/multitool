[config]
default_to_workspace = false

[env]
CARGO_MAKE_COVERAGE_PROVIDER = "llvm-cov"
CARGO_MAKE_CARGO_BUILD_TEST_FLAGS = ""
# This is the directory where we generate the CLI's reference
# documentation.
CLI_REFERENCE_DIR = "target/debug/"
# This is the name of the file containing the CLI's reference
# documentation.
CLI_REFERENCE_FILE_NAME = "reference.md"

[env.development]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[tasks.dev-test-flow]
dependencies = [
  "pre-build",
  "format-flow",
  "clippy-flow",
  "build",
  "post-build",
  "pre-docs",
  "docs",
  "post-docs",
  "test-flow",
]

[tasks.pre-build]
dependencies = ["format-toml-conditioned-flow", "unused-dependencies-flow"]

# Canonical clippy command — the single source of truth shared by CI
# (ci-flow -> clippy-flow) and the bacon clippy job. Overrides cargo-make's
# built-in `clippy` task so both paths run the IDENTICAL command. `-- -D warnings`
# makes any clippy or rustc warning fail both CI and the bacon monitor, so a
# clean monitor run predicts a clean CI clippy run exactly. `workspace = false`
# is explicit (the command iterates the workspace itself via `--workspace`).
[tasks.clippy]
description = "Canonical clippy command — shared by CI (ci-flow) and bacon."
category = "Development"
workspace = false
command = "cargo"
args = ["clippy", "--all-targets", "--workspace", "--locked", "--", "-D", "warnings"]

# The jev decision engine (MULTI-1819+) lives behind the `jev` Cargo feature,
# off by default, so it rots unless CI also builds, lints, and tests it
# (MULTI-1821). Byte-for-byte [tasks.clippy] plus `--features jev`. Run
# separately from `clippy` (rather than folded into it with a matrix of
# feature sets) so the two feature sets stay independently attributable in CI
# output and either one can fail on its own.
[tasks.clippy-jev]
description = "Canonical clippy command for the jev feature — shared by CI and bacon."
category = "Development"
workspace = false
command = "cargo"
args = ["clippy", "--all-targets", "--workspace", "--locked", "--features", "jev", "--", "-D", "warnings"]

[tasks.ci-flow]
dependencies = [
  "pre-ci-flow",
  "print-env-flow",
  "pre-build",
  "check-format-flow",
  "clippy-flow",
  "build",
  "post-build",
  "pre-docs",
  "docs",
  "post-docs",
  "test-flow",
  "coverage-flow",
  "post-ci-flow",
]

[tasks.test]
workspace = true
description = "Run our test suite"
command = "cargo"
args = [
  "nextest",
  "run",
  "--locked",
  "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
]

# Same intent as [tasks.clippy-jev]: exercise the `jev`-feature build so it
# doesn't rot behind the flag (MULTI-1821). `--features jev` only exists on
# the root `multitool` package, not on the `crates/multi-core` workspace
# member, so this task deliberately does NOT reuse [tasks.test]'s
# `workspace = true` (which has cargo-make invoke the command once per member
# directory — inside `crates/multi-core` alone, `--features jev` errors with
# "the package 'multi-core' does not contain this feature"). Instead, like
# `clippy`, it sets `workspace = false` and passes `--workspace` explicitly on
# a single invocation from the repo root: cargo accepts `--features jev`
# there because at least one selected package (`multitool`) declares it, and
# nextest still collects every workspace member's tests (verified locally:
# `cargo nextest run --locked --workspace --features jev` runs multi-core's
# test alongside multitool's).
[tasks.test-jev]
workspace = false
description = "Run our test suite with the jev feature enabled"
command = "cargo"
args = [
  "nextest",
  "run",
  "--locked",
  "--workspace",
  "--features",
  "jev",
  "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
]

# Bundles clippy-jev + test-jev behind one task so CI's jev job (see
# on-push.yml / on-merge.yml) has a single command to call, mirroring how
# `ci-flow` bundles the default-feature checks. Kept separate from `ci-flow`
# — not appended to its dependency list — so the jev checks run as their own
# parallel CI job instead of serializing after build/docs/coverage.
[tasks.ci-jev-flow]
dependencies = ["clippy-jev", "test-jev"]

[tasks.help]
command = "cargo"
description = "List help text for wack executable"
category = "Development"
args = [
  "run",
  "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
  "--",
  "--help",
]

[tasks.outdated]
workspace = true
description = "List dependencies with newer released versions"
args = ["outdated", "--root-deps-only", "--exit-code", "1"]

[tasks.fmt]
workspace = true
alias = "format"

[tasks.check-format]
workspace = true

[tasks.wc]
description = "Calculate the LoC in src."
category = "Development"
command = "tokei"
args = ["."]

[tasks.gen-cli-reference]
description = "Generate the CLI's reference documentation in Markdown format"
category = "Development"
script_runner = "@shell"
script = '''
  mkdir -p $CLI_REFERENCE_DIR || true
  cargo run --bin mkdown-docs --features=markdown > $CLI_REFERENCE_DIR/$CLI_REFERENCE_FILE_NAME
'''

[tasks.bacon]
description = "Watch tests and rerun on file change."
category = "Development"
command = "bacon"
args = [
  "nextest",
  "--",
  "--workspace",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
]

[tasks.monitor]
description = "Run bacon headless for Claude Code's Monitor tool (no TTY, summary output on each change)."
category = "Development"
workspace = false
command = "bacon"
args = ["--headless", "--summary", "--no-help-line"]
