[package]
name = "multitool"
version = "0.6.0"
edition = "2024"
default-run = "multi"
repository = "https://github.com/wack/multitool"
description = "Move fast without breaking things."
homepage = "https://multitool.run/"

[[bin]]
name = "multi"
path = "src/bin/main.rs"

[workspace]
members = ["crates/multi-core"]

[workspace.package]
authors = ["The MultiTool Team"]
edition = "2024"
version = "0.1.2"

[dependencies]
async-stream.workspace = true
async-trait = "0.1.81"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-apigateway = "1.50.0"
aws-sdk-cloudwatch = "1.54.0"
aws-sdk-lambda = "1.56.0"
aws-smithy-runtime-api = "1.7.4"
aws-smithy-types = "1.2.9"
bigdecimal = { version = "0.4.7", features = ["serde-json"] }
bon = "3.3.2"
cersei-provider = { git = "https://github.com/wack/cersei.git", branch = "trunk" }
chrono = "0.4.38"
clap = { version = "4.3", features = ["derive", "env"] }
console = "0.15.8"
derive-getters = "0.5.0"
dialoguer = "0.11.0"
directories = "6.0"
figment = { version = "0.10", default-features = false, features = ["env"] }
# Pure-Rust gzip (miniz_oxide backend, the default). Used with `tar` to build the
# opt-in `multi check --trace-archive` bundle entirely in memory.
flate2 = "1.0"
failsafe = "1.3.0"
futures-core = "0.3.31"
futures-util = "0.3.31"
indexmap = { version = "2.1.0", features = ["serde"] }
kameo = "0.20"
miette = { workspace = true, features = ["fancy"] }
mockall = "0.13.1"
multitool-sdk = { git = "https://github.com/wack/multitool-rust-sdk.git", branch = "trunk" }
pingora = { version = "0.3", features = ["lb", "proxy"], optional = true }
ratatui = "0.29"
rand = { version = "0.9.0", features = ["small_rng"] }
reqwest = { version = "0.12.15", default-features = false, features = [
  "rustls-tls",
  "charset",
  "http2",
  "macos-system-configuration",
] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json5 = "0.2.1"
serde_with = { version = "3.12", features = ["chrono"] }
# Pure-Rust tar writer for the in-memory `multi check --trace-archive` bundle.
tar = "0.4"
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-graceful-shutdown = "0.16.0"
tokio-stream = { workspace = true, features = ["time"] }
toml = { version = "0.8.8", features = ["preserve_order"] }
multi-core = { path = "crates/multi-core" }
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.19", features = [
  "json",
  "local-time",
  "time",
  "chrono",
  "fmt",
  "env-filter",
] }
url = "2.5.4"
uuid = { version = "1.9", features = ["serde", "v4"] }
ignore.workspace = true
base64.workspace = true
tokio-util.workspace = true
comrak = { version = "0.52", default-features = false }
libc = "0.2.186"
tempfile = "3"
cersei-agent = { git = "https://github.com/wack/cersei.git", branch = "trunk" }
cersei-memory = { git = "https://github.com/wack/cersei.git", branch = "trunk" }
cersei-tools = { git = "https://github.com/wack/cersei.git", branch = "trunk" }
cersei-types = { git = "https://github.com/wack/cersei.git", branch = "trunk" }
cersei-workflows = { git = "https://github.com/wack/cersei.git", branch = "trunk" }
textwrap = "0.16"

[workspace.dependencies]
pretty_assertions = "1.4"
static_assertions = "1.1"
base64 = "0.22"
ignore = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
twox-hash = { version = "2.1", features = ["xxhash32"] }
tokio = { version = "1.37.0", features = ["full"] }
miette = { version = "7", features = ["fancy"] }
tokio-stream = { version = "0.1", features = ["time"] }
async-stream = "0.3.6"
thiserror = "2.0"

[dev-dependencies]
# The `test` feature enables `figment::Jail` for hermetic env/file config tests.
figment = { version = "0.10", default-features = false, features = [
  "env",
  "test",
] }
pretty_assertions.workspace = true
static_assertions.workspace = true
tempfile = "3.8"

[features]
proxy = ["dep:pingora"]
errorlogs = []

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
formula = "multi"

[package.metadata.bacon]
default_job = "fmt-check"
env.CARGO_TERM_COLOR = "always"

[package.metadata.bacon.jobs.fmt-check]
command = ["cargo", "fmt", "--all", "--", "--check"]
need_stdout = false
on_success = "job:check"

[package.metadata.bacon.jobs.check]
command = ["cargo", "check", "--all-targets", "--workspace"]
need_stdout = false
on_success = "job:clippy"

[package.metadata.bacon.jobs.clippy]
command = ["cargo", "make", "clippy"]
need_stdout = false

[package.metadata.bacon.jobs.nextest]
command = [
  "cargo",
  "nextest",
  "run",
  "--workspace",
  "--hide-progress-bar",
  "--failure-output",
  "final",
]
need_stdout = true
analyzer = "nextest"
